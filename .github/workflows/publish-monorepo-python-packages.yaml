name: Publish monorepo Python packages

on:
  workflow_call:
    secrets:
      PYPI_PUBLISH_TOKEN:
        required: true
        description: "API token for authenticating and publishing to PyPI"

jobs:
  get-packages:
    name: Get changed packages
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.changed.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect version bumps
        id: changed
        run: |
          # Check if version changed between commits.
          packages=$(
            git diff ${{ github.event.push.before }} ${{ github.event.push.after }} --name-only \
              | grep "^pkg/[^/]*/pyproject\.toml$" \
              | while read -r f; do
                  old=$(git show ${{ github.event.push.before }}:"$f" 2>/dev/null | grep '^version' | head -1 | awk -F'"' '{print $2}')
                  new=$(git show ${{ github.event.push.after }}:"$f" | grep '^version' | head -1 | awk -F'"' '{print $2}')
                  if [ -z "$old" ]; then
                    # New package, no previous version.
                    echo "$f"
                  elif [ "$old" != "$new" ]; then
                    # Only publish if it's a version increase, otherwise, skip publishing.
                    lowest=$(printf '%s\n' "$old" "$new" | sort --version-sort | head -1)
                    if [ "$lowest" = "$old" ]; then
                      echo "$f"
                    fi
                  fi
                done \
              | xargs -I{} dirname {} \
              | xargs -I{} basename {} \
              | jq -R . | jq -sc .
          )
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

  build:
    name: Build | ${{ matrix.package }}
    needs: get-packages
    if: needs.get-packages.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: ${{ fromJSON(needs.get-packages.outputs.packages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: sudo snap install astral-uv --classic

      - name: Build ${{ matrix.package }}
        run: uv build pkg/${{ matrix.package }}

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.package }}
          path: dist/

  publish:
    name: Publish | ${{ matrix.package }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: ${{ fromJSON(needs.get-packages.outputs.packages) }}
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.package }}
          path: dist/

      - name: Check if version is already published
        id: published
        run: |
          shopt -s nullglob
          files=(dist/*.whl dist/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No distribution files found in dist/"
            exit 1
          fi

          # Distribution filenames are of the form `<name>-<version>-...`,
          # e.g. `charmed_hpc_libs-0.8.0-py3-none-any.whl`. PyPI package
          # names are normalized per PEP 503: lowercase, `-` separators.
          artifact=$(basename "${files[0]}")
          name=$(printf '%s' "${artifact%%-*}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[_.]+/-/g')
          version=$(printf '%s' "$artifact" | cut -d- -f2)

          if curl -fsSL "https://pypi.org/pypi/${name}/${version}/json" > /dev/null; then
            echo "${name} ${version} is already published to PyPI. Skipping upload."
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "${name} ${version} has not been published to PyPI yet."
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        run: sudo snap install astral-uv --classic

      - name: Publish to PyPI
        if: steps.published.outputs.already == 'false'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PUBLISH_TOKEN }}
        run: uv publish
